spring.application.name=connect
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jprime_connect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jprime}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jprime}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.sql.init.mode=never
jprime.jwt.secret=${JPRIME_JWT_SECRET:change-me-change-me-change-me-change-me-change-me-change-me}
jprime.jwt.expiration-minutes=${JPRIME_JWT_EXPIRATION_MINUTES:10080}
jprime.cors.allowed-origins=${JPRIME_CORS_ALLOWED_ORIGINS:http://localhost:5173}
